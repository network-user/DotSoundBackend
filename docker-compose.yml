services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotsound
      POSTGRES_PASSWORD: dotsound
      POSTGRES_DB: dotsound
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotsound"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dotsound

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dotsound

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dotsound

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://dotsound:dotsound@postgres:5432/dotsound
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - dotsound

  worker:
    build: .
    restart: unless-stopped
    command: taskiq worker app.core.tkq:broker app.services.transcoding
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://dotsound:dotsound@postgres:5432/dotsound
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - dotsound

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dotsound

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dotsound.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dotsound

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "9090:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - dotsound

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  portainer_data:
  redis_data:

networks:
  dotsound:
    driver: bridge
