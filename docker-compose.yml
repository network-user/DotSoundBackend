x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotsound
      POSTGRES_PASSWORD: dotsound
      POSTGRES_DB: dotsound
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotsound"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - dotsound

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - dotsound

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - dotsound

  backend:
    build:
      context: ..
      dockerfile: DotSoundBackend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      # PrivateCore-only configuration is kept in its own .env so the
      # public Backend never has to list those variables by name.
      # File is optional in dev: comment out the line if you don't
      # have a sibling DotSoundPrivateCore checkout.
      - ../DotSoundPrivateCore/.env
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://dotsound:dotsound@postgres:5432/dotsound
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    logging: *default-logging
    networks:
      - dotsound

  worker:
    build:
      context: ..
      dockerfile: DotSoundBackend/Dockerfile
    restart: unless-stopped
    command: taskiq worker app.core.tkq:broker app.services.transcoding app.services.import_worker app.services.cover_worker app.services.lyrics_worker app.services.artist_enrichment_worker app.services.track_info_worker app.services.artist_supplemental_worker
    env_file:
      - .env
      # PrivateCore-only configuration (lyrics provider tokens, audio
      # stage settings, etc.) is mounted from its own .env so the
      # public Backend env stays free of internal-stage variables.
      - ../DotSoundPrivateCore/.env
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://dotsound:dotsound@postgres:5432/dotsound
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    logging: *default-logging
    networks:
      - dotsound

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    logging: *default-logging
    networks:
      - dotsound

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - backup
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGUSER: dotsound
      PGPASSWORD: dotsound
      PGDATABASE: dotsound
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
      - redis_data:/redis-data:ro
      - ./.env:/app/.env:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /scripts/*.sh && crontab /scripts/backup-crontab && crond -f -d 8"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - dotsound

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dotsound.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    logging: *default-logging
    networks:
      - dotsound

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "9090:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    logging: *default-logging
    networks:
      - dotsound

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  portainer_data:
  redis_data:
  backup_data:

networks:
  dotsound:
    driver: bridge
