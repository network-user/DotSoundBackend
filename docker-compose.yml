# [LOCALIZATION 242-ФЗ] При развёртывании в продакшне все
# перечисленные ниже сервисы должны размещаться в РФ-локации
# хостинг-провайдера (serv.host или эквивалент) — этого требует
# 242-ФЗ для хранения ПДн граждан РФ. Подробнее — `docs/legal/HOSTING.md`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dotsound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dotsound}
      POSTGRES_DB: ${POSTGRES_DB:-dotsound}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dotsound}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - dotsound

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - dotsound

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - dotsound

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks:
      - dotsound

  backend:
    build:
      context: ..
      dockerfile: DotSoundBackend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      # PrivateCore-only configuration is kept in its own .env so the
      # public Backend never has to list those variables by name.
      # File is optional in dev: comment out the line if you don't
      # have a sibling DotSoundPrivateCore checkout.
      - ../DotSoundPrivateCore/.env
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dotsound}:${POSTGRES_PASSWORD:-dotsound}@postgres:5432/${POSTGRES_DB:-dotsound}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      INTERNAL_API_ALLOWED_CIDRS: ${INTERNAL_API_ALLOWED_CIDRS:-},172.16.0.0/12
      # Live sibling checkout overrides the PrivateCore baked into the
      # image (see volume below). Prod compose resets both.
      PYTHONPATH: /DotSoundPrivateCore/src
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - .:/app
      - ../DotSoundPrivateCore:/DotSoundPrivateCore:ro
    logging: *default-logging
    networks:
      - dotsound

  worker:
    build:
      context: ..
      dockerfile: DotSoundBackend/Dockerfile
    restart: unless-stopped
    command:
      - taskiq
      - worker
      - --workers
      - "1"
      - --max-async-tasks
      - "${TASKIQ_MAX_ASYNC_TASKS:-50}"
      - app.core.tkq:broker
      - app.services.transcoding
      - app.services.video_transcoding
      - app.services.telegram_import_backfill_service
      - app.services.import_worker
      - app.services.external_import_worker
      - app.services.import_lyrics_worker
      - app.services.import_queue_dispatcher
      - app.services.lyrics_global_orchestrator
      - app.services.cover_worker
      - app.services.lyrics_worker
      - app.services.artist_enrichment_worker
      - app.services.track_info_worker
      - app.services.artist_supplemental_worker
      - app.services.search_index_worker
      - app.services.artist_backfill_worker
      - app.services.artist_catalog_sync_worker
      - app.services.waveform_worker
      - app.services.snippet_worker
      - app.services.artist_stats_worker
      - app.services.playback_repair_worker
      - app.services.scheduler_service
      - app.services.account_deletion_worker
      - app.services.track_title_normalization_task
      - app.tasks.rec_cache_warmer
      - app.services.sc_import_verify_worker
    env_file:
      - .env
      # PrivateCore-only configuration (lyrics provider tokens, audio
      # stage settings, etc.) is mounted from its own .env so the
      # public Backend env stays free of internal-stage variables.
      - ../DotSoundPrivateCore/.env
    environment:
      MINIO_ENDPOINT: minio:9000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dotsound}:${POSTGRES_PASSWORD:-dotsound}@postgres:5432/${POSTGRES_DB:-dotsound}
      DB_POOL_SIZE: "15"
      DB_MAX_OVERFLOW: "25"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      INTERNAL_API_ALLOWED_CIDRS: ${INTERNAL_API_ALLOWED_CIDRS:-},172.16.0.0/12
      PYTHONPATH: /DotSoundPrivateCore/src
      # If Tor fails to start the worker must not crash — it falls back
      # to direct/proxy connections. Override with TOR_POOL_FAIL_CLOSED=true
      # in .env only when Tor is required for all outbound requests.
      TOR_POOL_FAIL_CLOSED: "false"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - .:/app
      - ../DotSoundPrivateCore:/DotSoundPrivateCore:ro
    logging: *default-logging
    networks:
      - dotsound

  # Периодически парсит актуальный client_id с SoundCloud и пишет в
  # .env (раз в неделю; см. scripts/sc_id_refresher.py). Профиль sc-refresh
  # для локального `docker compose up` без профилей — контейнер не стартует.
  # В prod docker-compose.prod.yml снимает профиль; deploy.sh поднимает сервис.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      CLAMD_CONF_MaxFileSize: "200M"
      CLAMD_CONF_StreamMaxLength: "200M"
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging: *default-logging
    networks:
      - dotsound

  sc_id_refresher:
    build:
      context: ..
      dockerfile: DotSoundBackend/Dockerfile
    restart: unless-stopped
    command:
      - poetry
      - run
      - python
      - scripts/sc_id_refresher.py
    profiles:
      - sc-refresh
    env_file:
      - .env
    working_dir: /app
    volumes:
      - .:/app
    logging: *default-logging
    networks:
      - dotsound

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    logging: *default-logging
    networks:
      - dotsound

  bot:
    build:
      context: ..
      dockerfile: DotSoundBot/Dockerfile
    restart: unless-stopped
    env_file:
      - ../DotSoundBot/.env
    environment:
      INTERNAL_API_COMPOSE_BIND: "true"
      INTERNAL_API_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/1
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    logging: *default-logging
    networks:
      - dotsound

  compute-worker-cpu:
    build:
      context: ..
      dockerfile: DotSoundComputeWorker/docker/Dockerfile.cpu
    restart: unless-stopped
    env_file:
      - ../DotSoundComputeWorker/.env
    environment:
      WORKER_BACKEND_BASE_URL: http://backend:8000
    profiles:
      - cpu
    depends_on:
      backend:
        condition: service_started
    logging: *default-logging
    networks:
      - dotsound

  compute-worker-gpu:
    build:
      context: ..
      dockerfile: DotSoundComputeWorker/docker/Dockerfile.gpu
    restart: unless-stopped
    env_file:
      - ../DotSoundComputeWorker/.env
    environment:
      WORKER_BACKEND_BASE_URL: http://backend:8000
    profiles:
      - gpu
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: *default-logging
    networks:
      - dotsound

  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    restart: unless-stopped
    profiles:
      - backup
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dotsound}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dotsound}
      PGDATABASE: ${POSTGRES_DB:-dotsound}
      MINIO_BACKUP_ENDPOINT: http://minio:9000
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
      - redis_data:/redis-data:ro
      - ./.env:/app/.env:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /scripts/*.sh && crontab /scripts/backup-crontab && crond -f -d 8"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    networks:
      - dotsound

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dotsound.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    logging: *default-logging
    networks:
      - dotsound

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "9090:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    logging: *default-logging
    networks:
      - dotsound

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  portainer_data:
  redis_data:
  elasticsearch_data:
  backup_data:
  clamav_data:

networks:
  dotsound:
    driver: bridge
