  <style>
    /* Fixed .sound loader */
    body, html {
      margin: 0; padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100%; width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #root {
      width: 100%;
      height: 100%;
      min-width: 0;
      overflow: hidden;
    }
    #ds-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 0;
      user-select: none;
      contain: strict;
    }
    .loader-mark {
      display: inline-flex;
      align-items: baseline;
      gap: 1px;
      white-space: nowrap;
      line-height: 1;
      animation: loaderPulse 1.8s ease-in-out infinite;
    }
    .loader-dot {
      color: #fff;
    }
    .loader-text {
      color: #fff;
    }
    @keyframes loaderPulse {
      0%, 100% { opacity: 0.72; transform: scale(0.985); }
      50% { opacity: 1; transform: scale(1); }
    }
    #ds-loader.fade-out {
      opacity: 0;
      transition: opacity 0.32s ease;
      pointer-events: none;
    }
  </style>

<body>
  <div id="ds-loader">
    <span class="loader-mark" aria-label=".sound">
      <span class="loader-dot">.</span><span class="loader-text">sound</span>
    </span>
  </div>
  <div id="root"></div>
  <script>
    // Hide loader once the app marks itself as ready, with
    // a hard ceiling so we don't block on slow networks.
    (function () {
      var loader = document.getElementById('ds-loader');
      var done = false;
      function hide() {
        if (done || !loader) return;
        done = true;
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 350);
      }
      window.addEventListener('app-ready', hide);
      var started = Date.now();
      var id = setInterval(function () {
        var root = document.getElementById('root');
        if ((root && root.firstChild) || Date.now() - started > 6000) {
          clearInterval(id);
          hide();
        }
      }, 100);
    })();
  </script>
