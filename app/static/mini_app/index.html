  <style>
    /* Premium Monochrome Loader */
    body, html {
      margin: 0; padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100%; width: 100%;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #root {
      width: 100%;
      height: 100%;
      min-width: 0;
      overflow: hidden;
    }
    #ds-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 32px; letter-spacing: -1.5px;
      user-select: none;
    }
    .loader-dot {
      opacity: 0;
      transform: scale(0.5);
      animation: dotFadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin-right: 2px;
      color: #fff;
    }
    .loader-text {
      display: flex; overflow: hidden; width: 0;
      animation: textReveal 1.2s 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards;
      white-space: nowrap;
    }
    .loader-char {
      opacity: 0;
      display: inline-block;
      transform: translateY(10px);
      animation: charSlideUp 0.4s forwards;
    }
    
    @keyframes dotFadeIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes textReveal {
      to { width: 90px; } /* Adjusted to "sound" width */
    }
    @keyframes charSlideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    #ds-loader.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
  </style>

    </div>

  <div id="root"></div>
  <script>
    // Hide loader once the app marks itself as ready, with
    // a hard ceiling so we don't block on slow networks.
    (function () {
      var loader = document.getElementById('ds-loader');
      var done = false;
      function hide() {
        if (done || !loader) return;
        done = true;
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 350);
      }
      window.addEventListener('app-ready', hide);
      // Hard cap: do not spin past 1200ms even if the
      // app event never fires.
      setTimeout(hide, 1200);
    })();
  </script>
