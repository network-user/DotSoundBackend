map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS server. Required for re-resolving upstream
# names (e.g. `backend`) when their container is recreated and gets
# a new IP, instead of caching the first lookup forever.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    client_max_body_size 200m;

    location /mini_app/ {
        alias /usr/share/nginx/html/mini_app/;
        index index.html;
        try_files $uri $uri/ /mini_app/index.html;
    }

    location /api/ {
        # Force runtime DNS resolution by using a variable in
        # `proxy_pass`. Without this, nginx only resolves `backend`
        # on config load and breaks after backend restarts.
        #
        # IMPORTANT: when `proxy_pass` contains a variable, nginx
        # disables the automatic location-prefix rewrite. To preserve
        # the original request URI (so `/api/v1/health` reaches
        # backend as `/api/v1/health` and not as `/api/`), omit the
        # trailing path from proxy_pass and let nginx pass the full
        # request URI verbatim.
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        return 301 /mini_app/;
    }
}
