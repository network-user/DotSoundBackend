map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS server. Required for re-resolving upstream
# names (e.g. `backend`) when their container is recreated and gets
# a new IP, instead of caching the first lookup forever.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    client_max_body_size 200m;

    # Admin bundle is split into a non-hashed file
    # (assets/secure/admin-bundle.js) because the AdminContext loads
    # it via a signed URL whose path must be stable. Without an
    # explicit Cache-Control header browsers (especially the
    # Telegram Mini App webview) hold on to the previous deploy's
    # admin-bundle.js while the main bundle is already on the new
    # hashed filename — the resulting export-mismatch shows up as
    # "TypeError: <minified> is not a function" inside the boundary.
    # Force revalidation on every load so admin-bundle.js always
    # matches the freshly-deployed main bundle.
    location /mini_app/assets/secure/ {
        alias /usr/share/nginx/html/mini_app/assets/secure/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /mini_app/ {
        alias /usr/share/nginx/html/mini_app/;
        index index.html;
        try_files $uri $uri/ /mini_app/index.html;
    }

    location /api/ {
        # Force runtime DNS resolution by using a variable in
        # `proxy_pass`. Without this, nginx only resolves `backend`
        # on config load and breaks after backend restarts.
        #
        # IMPORTANT: when `proxy_pass` contains a variable, nginx
        # disables the automatic location-prefix rewrite. To preserve
        # the original request URI (so `/api/v1/health` reaches
        # backend as `/api/v1/health` and not as `/api/`), omit the
        # trailing path from proxy_pass and let nginx pass the full
        # request URI verbatim.
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        # Preserve the query string on redirect - the Telegram bot's
        # "Ввести код на сайте" button (and email magic-links) point
        # at the domain root with ?auth=code / ?token=..., which must
        # survive the redirect for AuthScreen to skip straight to the
        # right step instead of the method-choice screen.
        return 301 /mini_app/$is_args$args;
    }
}
