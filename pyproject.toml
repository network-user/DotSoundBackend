[tool.poetry]
name = "dotsoundbackend"
version = "0.1.0"
description = "Backend API for DotSound"
authors = []
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { extras = ["standard"], version = "^0.111" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
alembic = "^1.13"
aioboto3 = "^13.1"
httpx = {extras = ["socks"], version = "^0.27"}
stem = "^1.8"
pydantic-settings = "^2.3"
uvicorn = { extras = ["standard"], version = "^0.30" }
structlog = "^24.1"
slowapi = "^0.1.9"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
taskiq = "^0.11"
taskiq-redis = "^1.0"
redis = "^5.0"
Pillow = "^11.0"
cryptography = "^44.0"
resend = "^2.0"
pyotp = "^2.9"
qrcode = {extras = ["pil"], version = "^8.0"}
pydantic = {extras = ["email"], version = "^2.0"}
python-magic = "^0.4"
python-magic-bin = {version = "^0.4", markers = "sys_platform == 'win32'"}
dotsound-private-core = { path = "../DotSoundPrivateCore", develop = true, extras = ["scanners", "proxies"] }
prometheus-client = "^0.20"
sentry-sdk = {extras = ["fastapi"], version = "^2.13"}
docker = "^7.1"
opentelemetry-api = "^1.27"
opentelemetry-sdk = "^1.27"
opentelemetry-exporter-otlp = "^1.27"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"
elasticsearch = "^8.12"
yt-dlp = ">=2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
anyio = { extras = ["trio"], version = "^4.4" }
pytest-anyio = "*"
httpx = "^0.27"
aiosqlite = "^0.20"
mypy = "^1.10"
ruff = "^0.5"
black = "^24.4"
dirty-equals = "^0.8"
factory-boy = "^3.3"
freezegun = "^1.5"
pytest-mock = "^3.14"
respx = "^0.21"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "s3: tests requiring S3/MinIO",
    "redis: tests requiring Redis",
    "slow: slow integration tests",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/api/*",
    "*/services/*",
    "*/core/*",
    "*/middlewares/*",
    "*/repositories/*",
    "*/dependencies.py",
    "*/main.py",
    "*/utils/soundcloud_playlist_url.py",
    "*/utils/spotify_import_url.py",
    "*/tasks/audio_compute_reaper.py",
    "*/config.py",
    "*/search/es_client.py",
    "*/search/indices.py",
    "*/search/documents.py",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
