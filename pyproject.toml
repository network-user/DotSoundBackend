[tool.poetry]
name = "dotsoundbackend"
version = "0.1.0"
description = "Backend API for DotSound"
authors = []
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { extras = ["standard"], version = "^0.111" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
alembic = "^1.13"
aioboto3 = "^13.1"
pydantic-settings = "^2.3"
uvicorn = { extras = ["standard"], version = "^0.30" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
anyio = { extras = ["trio"], version = "^4.4" }
pytest-anyio = "*"
httpx = "^0.27"
aiosqlite = "^0.20"
mypy = "^1.10"
ruff = "^0.5"
black = "^24.4"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
