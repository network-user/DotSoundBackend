# Optional reverse-proxy config for hosting the admin panel on
# a dedicated subdomain `admin.dotsound.example`.
#
# This file is reference-only — copy and adjust for your TLS
# termination layer (nginx, Caddy, Traefik). The plan does NOT
# require a separate domain; the panel works equally well on
# `https://<your-app>/admin` because:
#   * SecureStaticMiddleware blocks the admin chunk for non-admins,
#   * AdminSecurityMiddleware enforces CSRF + strict CSP + audit,
#   * admin JWT is `scope=admin`, short-lived, and device-bound.

server {
    listen 443 ssl http2;
    server_name admin.dotsound.example;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/admin.dotsound.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dotsound.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS preload — only enable AFTER the cert is rock solid.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Optional mTLS ---
    # ssl_client_certificate /etc/nginx/admin-clients-ca.crt;
    # ssl_verify_client on;

    client_max_body_size 5m;

    # --- Admin SPA (signed bundle URL) ---
    # Frontend assets served by FastAPI under /mini_app/assets/.
    # The admin bundle URL is HMAC-signed; non-admins get 404.
    location /admin {
        proxy_pass http://127.0.0.1:8000/mini_app/admin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Admin API + WebSocket ---
    location /api/v1/admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600;
    }

    # --- Static admin assets ---
    location /mini_app/assets/secure/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # --- Block all other paths so the admin domain only serves
    #     admin surface area. ---
    location / {
        return 404;
    }
}
